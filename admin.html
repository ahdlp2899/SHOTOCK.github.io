<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Crushly · Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="crushly.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
[hidden]{display:none!important}
.wrap.ad{max-width:780px;padding-bottom:60px}
.tb{display:flex;align-items:center;gap:10px}.tb .grow{flex:1}
.tag{padding:6px 14px;border-radius:999px;border:1.5px solid var(--hot);background:rgba(255,45,141,.18);font-weight:600;letter-spacing:.12em;font-size:12px;text-transform:uppercase}
.glow{height:1px;margin:8px 0 14px;background:linear-gradient(90deg,transparent,var(--pink),transparent);box-shadow:0 0 12px var(--pink)}
.seg{display:flex;gap:6px;padding:5px;border-radius:999px;border:1px solid rgba(138,46,255,.5);background:rgba(20,10,45,.6);margin-bottom:14px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:0 0 auto;padding:11px 16px;border:0;border-radius:999px;background:none;color:var(--muted);font:500 14px "Poppins",system-ui,sans-serif;white-space:nowrap;transition:.3s}
.seg .on{color:#fff;background:linear-gradient(135deg,rgba(255,45,141,.6),rgba(138,46,255,.6));box-shadow:0 0 14px rgba(255,45,141,.6)}
.seg em{font-style:normal;margin-left:4px;padding:1px 7px;border-radius:9px;background:var(--pink);font-size:12px}
.ld{width:34px;height:34px;margin:50px auto;border-radius:50%;border:3px solid rgba(138,46,255,.3);border-top-color:var(--pink);animation:sp .8s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.sg{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.sc{padding:16px;border-radius:22px;border:1.5px solid rgba(255,45,141,.45);background:linear-gradient(160deg,rgba(60,20,110,.35),rgba(15,6,30,.55));animation:in .5s both}
.sc b{display:block;font-size:30px}.sc small{color:var(--muted)}
.h3{margin:22px 0 10px;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--hot)}
.chart{padding:16px}
.bars{display:flex;align-items:flex-end;gap:5px;height:130px}
.bars div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:10px;color:var(--muted)}
.bars i{display:block;width:100%;min-height:3px;border-radius:5px 5px 0 0;background:linear-gradient(var(--hot),var(--purple));box-shadow:0 0 8px rgba(255,45,141,.5)}
.hb2{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:14px}.hb2 span:first-child{width:92px;flex:0 0 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb2 .t{flex:1;height:10px;border-radius:6px;background:rgba(138,46,255,.25);overflow:hidden}.hb2 .t i{display:block;height:100%;background:linear-gradient(90deg,var(--pink),var(--purple))}
.search{width:100%;margin-bottom:12px;padding:14px 16px;border-radius:16px;border:1.5px solid rgba(138,46,255,.55);background:rgba(20,10,45,.6);color:#fff;font:16px "Poppins",system-ui,sans-serif}
.search:focus,textarea:focus{outline:0;border-color:var(--hot);box-shadow:0 0 18px rgba(255,45,141,.45)}
textarea.search{min-height:90px;resize:vertical}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.fc{padding:8px 14px;border-radius:999px;border:1.5px solid rgba(138,46,255,.55);background:rgba(20,10,45,.6);color:var(--muted);font:500 13px "Poppins",system-ui,sans-serif}
.fc.on{color:#fff;border-color:var(--hot);background:rgba(255,45,141,.25)}.fc.ex{margin-left:auto;border-color:var(--hot);color:#fff}
.card{padding:14px;margin-bottom:12px;animation:in .4s both}
.row1{display:flex;gap:12px;align-items:center}.row1>div{flex:1;min-width:0}
.av{width:56px;height:56px;border-radius:50%;object-fit:cover;border:2px solid var(--hot);flex:0 0 auto;cursor:pointer}
.card small{display:block;color:var(--muted);overflow:hidden;text-overflow:ellipsis}
.chip{display:inline-block;margin:6px 6px 0 0;padding:3px 10px;border-radius:999px;font-size:12px;border:1px solid var(--hot);background:rgba(255,45,141,.15)}
.chip.red{border-color:#ff4d6d;background:rgba(255,77,109,.16);color:#ff9db0}.chip.ok{border-color:#2ee68a;background:rgba(46,230,138,.15);color:#8dffc4}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.acts button{flex:1 1 28%;padding:11px 8px;border-radius:14px;border:1.5px solid rgba(138,46,255,.55);background:rgba(20,10,45,.6);color:#fff;font:500 13px "Poppins",system-ui,sans-serif;transition:.2s}
.acts button:hover{transform:translateY(-2px)}.acts .danger{border-color:#ff4d6d;color:#ff9db0;background:rgba(255,77,109,.12)}.acts .good{border-color:#2ee68a;color:#8dffc4;background:rgba(46,230,138,.12)}
.reason{margin-top:8px;font-size:15px}.det{margin-top:6px;font-style:italic;color:#e7d6ff}
.empty{padding:24px;text-align:center;color:var(--muted)}.deny{padding:28px;text-align:center}
.pg{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.pg .ph{border-radius:20px;overflow:hidden;border:1.5px solid rgba(255,45,141,.45);background:rgba(20,10,45,.6);animation:in .4s both}
.pg img{display:block;width:100%;aspect-ratio:1;object-fit:cover}.pg .ph div{padding:10px}.pg .ph small{display:block;color:var(--muted);margin-bottom:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pg button{width:100%;padding:9px;border-radius:12px;border:1.5px solid #ff4d6d;background:rgba(255,77,109,.12);color:#ff9db0;font:500 13px "Poppins",system-ui,sans-serif}
.sbg{position:fixed;inset:0;z-index:20;background:rgba(7,4,15,.6);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:min(560px,100%);max-height:92vh;overflow:auto;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px));border-radius:26px 26px 0 0;animation:up .35s cubic-bezier(.2,.8,.2,1) both}
@keyframes up{from{transform:translateY(100%)}}
.pfimg{display:block;width:100%;max-height:40vh;object-fit:cover;border-radius:18px;margin-bottom:10px;background:#140a2d}
.sheet h3{margin:0;font-size:22px}.sg2{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px;margin:12px 0}
.sg2 div{padding:10px;border-radius:14px;border:1px solid rgba(138,46,255,.5);background:rgba(20,10,45,.6);text-align:center}.sg2 b{display:block;font-size:20px}.sg2 small{color:var(--muted);font-size:11px}
.kv{padding:10px 2px;border-top:1px solid rgba(138,46,255,.25)}.kv small{display:block;color:var(--muted);font-size:12px}.kv b{font-weight:500;white-space:pre-wrap;word-break:break-word}
.mb{display:block;width:100%;margin-top:12px;padding:14px;border-radius:16px;border:1.5px solid rgba(138,46,255,.55);background:rgba(20,10,45,.6);color:#fff;font:500 15px "Poppins",system-ui,sans-serif}
.pk{background:linear-gradient(135deg,var(--pink),var(--purple));border:0;box-shadow:0 0 16px rgba(255,45,141,.6);color:#fff;padding:14px;border-radius:16px;font:500 15px "Poppins",system-ui,sans-serif;width:100%}
.log{padding:12px 14px;margin-bottom:8px;border-radius:16px;border:1px solid rgba(138,46,255,.4);background:rgba(20,10,45,.5);font-size:14px}.log small{color:var(--muted)}
</style></head>
<body><canvas id="fx"></canvas>
<main class="wrap ad page">
  <div class="tb"><div id="top" data-hero="0" class="grow"></div><span class="tag">Admin</span></div>
  <div class="glow"></div>
  <div id="shell" hidden>
    <nav class="seg" id="tabs"><button data-t="over" class="on">Overview</button><button data-t="users">Users</button><button data-t="photos">Photos</button><button data-t="reports">Reports<em id="rc" hidden>0</em></button><button data-t="news">Announce</button><button data-t="activity">Activity</button></nav>
    <div id="app"><div class="ld"></div></div>
  </div>
  <div id="deny" class="glass deny" hidden><h2 style="margin:0 0 8px">Not authorized</h2><p class="lead">This page is only for the app owner.</p><a class="btn nav" href="dashboard.html" style="display:block;text-decoration:none;text-align:center">Back to app</a></div>
  <p class="foot"><a class="link nav" href="dashboard.html" style="letter-spacing:0;text-transform:none;margin-right:18px">&larr; Back to app</a><a href="#" id="out" class="link" style="letter-spacing:0;text-transform:none">Log out</a></p>
</main>
<div id="sheet" class="sbg" hidden><div class="sheet glass" id="sheetc"></div></div>
<div id="toast" role="status" style="position:fixed;z-index:70;left:50%;top:18px;transform:translate(-50%,-90px);padding:12px 20px;border-radius:999px;background:rgba(15,6,30,.94);border:1.5px solid var(--hot);transition:transform .4s;max-width:90%;text-align:center"></div>
<script src="config.js"></script><script src="crushly.js"></script>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const PH = "data:image/svg+xml," + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#140a2d"/><circle cx="50" cy="38" r="16" fill="#8A2EFF"/><path d="M18 88c4-22 20-30 32-30s28 8 32 30Z" fill="#8A2EFF"/></svg>');
let tt; const say = t => { const e = $("toast"); e.textContent = t; e.style.transform = "translate(-50%,0)"; clearTimeout(tt); tt = setTimeout(() => e.style.transform = "translate(-50%,-90px)", 2600); };
const H = h => { $("app").innerHTML = h; };
const fdate = d => new Date(d).toLocaleDateString([], { day: "numeric", month: "short", year: "numeric" });
const ago = d => { const m = Math.round((Date.now() - new Date(d)) / 6e4); return m < 60 ? Math.max(m, 1) + "m ago" : m < 1440 ? Math.round(m / 60) + "h ago" : Math.round(m / 1440) + "d ago"; };
const ageOf = d => { const b = new Date(d), n = new Date(); let a = n.getFullYear() - b.getFullYear(); if (n < new Date(n.getFullYear(), b.getMonth(), b.getDate())) a--; return a; };
const fail = (e, blk) => `<div class="glass empty">${esc(/function|schema|relation|Not authorized|does not exist/i.test(e.message) ? "Run the " + (blk || "admin") + " SQL in Supabase first. " : "")}${esc(e.message)}</div>`;
let tab = "over", rtab = "open", ufilter = "all", UD = [], timer;

/* ---------- overview + analytics ---------- */
async function over() {
  const [s, a] = await Promise.all([db.rpc("admin_stats"), db.rpc("admin_analytics")]);
  if (s.error) return H(fail(s.error)); const d = s.data;
  const c = (n, l, i) => `<div class="sc" style="animation-delay:${i * 50}ms"><b>${n}</b><small>${l}</small></div>`; badge(d.open_reports);
  let html = `<div class="sg">${c(d.users, "Users", 0)}${c(d.new_today, "New today", 1)}${c(d.banned, "Banned", 2)}${c(d.matches, "Matches", 3)}${c(d.messages, "Messages", 4)}${c(d.dates, "Dates", 5)}${c(d.open_reports, "Open reports", 6)}${a.data ? c(a.data.chatters7, "Active chatters (7d)", 7) : ""}</div>`;
  if (a.error) html += `<div class="h3">Analytics</div>${fail(a.error, "analytics (block A)")}`;
  else { const A = a.data, mx = Math.max(1, ...A.signups.map(x => x.n)), gm = Math.max(1, ...A.gender.map(x => x.n)), cm = Math.max(1, ...A.cities.map(x => x.n));
    html += `<div class="h3">New users \u2014 last 14 days</div><div class="glass chart"><div class="bars">${A.signups.map(x => `<div title="${esc(x.d)}: ${x.n}"><span>${x.n || ""}</span><i style="height:${Math.round(x.n / mx * 100)}%"></i><span>${esc(x.d.slice(8))}</span></div>`).join("")}</div></div>
      <div class="h3">Gender</div><div class="glass chart">${A.gender.map(x => `<div class="hb2"><span>${esc(x.g)}</span><span class="t"><i style="width:${Math.round(x.n / gm * 100)}%"></i></span><b>${x.n}</b></div>`).join("") || "No data"}</div>
      <div class="h3">Top cities</div><div class="glass chart">${A.cities.map(x => `<div class="hb2"><span>${esc(x.c)}</span><span class="t"><i style="width:${Math.round(x.n / cm * 100)}%"></i></span><b>${x.n}</b></div>`).join("") || "No data"}</div>`; }
  H(html);
}
const badge = n => { $("rc").hidden = !n; $("rc").textContent = n; };

/* ---------- users ---------- */
async function users() {
  H(`<input id="uq" class="search" type="search" placeholder="Search name, email or city\u2026" aria-label="Search users">
  <div class="chips">${[["all", "All"], ["banned", "Banned"], ["new", "New (7d)"], ["admins", "Admins"]].map(([k, l]) => `<button class="fc ${k === ufilter ? "on" : ""}" data-f="${k}">${l}</button>`).join("")}<button class="fc ex" data-a="export">Export CSV</button></div>
  <div id="ul"><div class="ld"></div></div>`);
  $("uq").addEventListener("input", () => { clearTimeout(timer); timer = setTimeout(loadUsers, 300); }); loadUsers();
}
async function loadUsers() {
  const { data, error } = await db.rpc("admin_list_users", { q: $("uq") ? $("uq").value.trim() : "" });
  if (error) return $("ul").innerHTML = fail(error); UD = data; renderUsers();
}
function renderUsers() {
  const wk = 7 * 864e5, list = UD.filter(u => ufilter === "all" || (ufilter === "banned" && u.is_banned) || (ufilter === "admins" && u.is_admin) || (ufilter === "new" && Date.now() - new Date(u.created_at) < wk));
  $("ul").innerHTML = list.length ? list.map((u, i) => `<article class="glass card" style="animation-delay:${Math.min(i, 8) * 40}ms"><div class="row1"><img class="av" data-a="det:${u.id}" src="${esc(u.avatar_url || PH)}" alt=""><div><b>${esc(u.display_name)}</b><small>${esc(u.email)}</small><small>${esc([u.gender, u.city, u.country].filter(Boolean).join(" \u00b7 "))} \u00b7 joined ${fdate(u.created_at)}</small></div></div>
    ${u.is_admin ? '<span class="chip ok">Admin</span>' : ""}${u.is_banned ? '<span class="chip red">Banned</span>' : ""}
    <div class="acts"><button data-a="det:${u.id}">Details</button>${u.is_admin ? "" : (u.is_banned ? `<button class="good" data-a="unban:${u.id}">Unban</button>` : `<button class="danger" data-a="ban:${u.id}">Ban</button>`) + `<button class="danger" data-a="del:${u.id}">Delete</button>`}</div></article>`).join("") + (UD.length >= 100 ? `<p class="hint" style="text-align:center;color:var(--muted)">Showing the latest 100 \u2014 use search to find others.</p>` : "")
    : `<div class="glass empty">No users found.</div>`;
}
async function detail(id) {
  const { data: d, error } = await db.rpc("admin_user_detail", { target: id }); if (error) return say(/function/i.test(error.message) ? "Run the user tools SQL (block B) first" : error.message);
  const p = d.profile || {}, self = p.is_admin;
  $("sheetc").innerHTML = `<img class="pfimg" src="${esc(p.avatar_url || PH)}" alt=""><h3>${esc(p.display_name)}${p.birthdate ? ", " + ageOf(p.birthdate) : ""}</h3><small style="color:var(--muted)">${esc(d.email)}</small>
  <div>${p.is_admin ? '<span class="chip ok">Admin</span>' : ""}${p.is_banned ? '<span class="chip red">Banned</span>' : ""}</div>
  <div class="sg2"><div><b>${d.matches}</b><small>Matches</small></div><div><b>${d.messages}</b><small>Messages</small></div><div><b>${d.dates}</b><small>Dates</small></div><div><b>${d.reports_against}</b><small>Reports against</small></div><div><b>${d.reports_by}</b><small>Reports made</small></div></div>
  ${[["Gender", p.gender], ["Looking for", p.looking_for], ["Height", p.height_cm && p.height_cm + " cm"], ["Weight", p.weight_kg && p.weight_kg + " kg"], ["Education", p.education], ["Address", [p.city, p.state, p.country].filter(Boolean).join(", ")], ["About", p.bio], ["Joined", p.created_at && fdate(p.created_at)], ["Last sign-in", d.last_sign_in && ago(d.last_sign_in)]].map(([k, v]) => `<div class="kv"><small>${k}</small><b>${esc(v || "\u2014")}</b></div>`).join("")}
  ${d.report_list.length ? `<div class="h3">Reports against this user</div>` + d.report_list.map(r => `<div class="log"><b>${esc(r.reason)}</b> <small>\u00b7 ${esc(r.status)} \u00b7 ${ago(r.at)}</small>${r.details ? `<div class="det">\u201C${esc(r.details)}\u201D</div>` : ""}</div>`).join("") : ""}
  <div class="acts">${self ? "" : (p.is_banned ? `<button class="good" data-a="unban:${id}">Unban</button>` : `<button class="danger" data-a="ban:${id}">Ban</button>`)}${p.avatar_url ? `<button data-a="photo:${id}">Remove photo</button>` : ""}<button data-a="${p.is_admin ? "rmadm" : "mkadm"}:${id}">${p.is_admin ? "Remove admin" : "Make admin"}</button>${self ? "" : `<button class="danger" data-a="del:${id}">Delete</button>`}</div>
  <button class="mb" data-close type="button">Close</button>`;
  $("sheet").hidden = false;
}
function exportCsv() {
  db.rpc("admin_export_users").then(({ data, error }) => {
    if (error) return say(/function/i.test(error.message) ? "Run the user tools SQL (block B) first" : error.message);
    const cols = ["id", "email", "display_name", "gender", "birthdate", "city", "country", "is_banned", "created_at"];
    const cell = v => { let s = String(v == null ? "" : v); if (/^[=+\-@\t\r]/.test(s)) s = "'" + s; return '"' + s.replace(/"/g, '""') + '"'; };
    const csv = [cols.join(",")].concat(data.map(r => cols.map(c => cell(r[c])).join(","))).join("\n");
    const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" })); a.download = "crushly-users-" + new Date().toISOString().slice(0, 10) + ".csv"; a.click();
    logAct("export_users", null, data.length + " users"); say("Exported " + data.length + " users");
  });
}

/* ---------- photos ---------- */
async function photos() {
  H(`<div id="pl"><div class="ld"></div></div>`);
  const { data, error } = await db.from("profiles").select("id,display_name,avatar_url,created_at").not("avatar_url", "is", null).order("created_at", { ascending: false }).limit(60);
  if (error) return $("pl").innerHTML = fail(error);
  $("pl").innerHTML = data.length ? `<div class="pg">${data.map((p, i) => `<div class="ph" style="animation-delay:${Math.min(i, 10) * 40}ms"><img loading="lazy" src="${esc(p.avatar_url)}" alt=""><div><small>${esc(p.display_name)}</small><button data-a="photo:${p.id}">Remove photo</button></div></div>`).join("")}</div>` : `<div class="glass empty">No profile photos yet.</div>`;
}

/* ---------- reports ---------- */
async function reports() {
  H(`<div class="seg"><button data-r="open" class="${rtab === "open" ? "on" : ""}">Open</button><button data-r="done" class="${rtab === "done" ? "on" : ""}">Resolved</button></div><div id="rl"><div class="ld"></div></div>`);
  const q = db.from("reports").select("*").order("created_at", { ascending: false }).limit(100);
  const { data, error } = await (rtab === "open" ? q.eq("status", "open") : q.neq("status", "open"));
  if (error) return $("rl").innerHTML = fail(error);
  const ids = [...new Set(data.flatMap(r => [r.reporter, r.reported]))], P = {};
  if (ids.length) ((await db.from("profiles").select("id,display_name,avatar_url,is_banned").in("id", ids)).data || []).forEach(p => P[p.id] = p);
  const nm = id => esc((P[id] || {}).display_name || "Deleted user");
  $("rl").innerHTML = data.length ? data.map(r => `<article class="glass card"><div class="row1"><img class="av" data-a="det:${r.reported}" src="${esc((P[r.reported] || {}).avatar_url || PH)}" alt=""><div><b>${nm(r.reported)}</b><small>reported by ${nm(r.reporter)} \u00b7 ${ago(r.created_at)}</small></div></div>
    <div class="reason"><span class="chip">${esc(r.reason)}</span>${(P[r.reported] || {}).is_banned ? '<span class="chip red">Banned</span>' : ""}</div>${r.details ? `<div class="det">\u201C${esc(r.details)}\u201D</div>` : ""}
    ${r.status === "open" ? `<div class="acts"><button data-a="det:${r.reported}">View user</button><button class="danger" data-a="rban:${r.id}">Ban user</button><button data-a="rdis:${r.id}">Dismiss</button></div>` : `<span class="chip ok">${esc(r.status)}</span>`}</article>`).join("")
    : `<div class="glass empty">${rtab === "open" ? "No open reports. All clear \u2665" : "No resolved reports yet."}</div>`;
}

/* ---------- announcements ---------- */
async function news() {
  H(`<textarea id="nt" class="search" maxlength="300" placeholder="Write a message every user will see on their Home screen\u2026"></textarea><button class="pk" data-a="post" type="button">Post announcement</button><div class="h3">Your announcements</div><div id="nl"><div class="ld"></div></div>`);
  const { data, error } = await db.from("announcements").select("*").order("created_at", { ascending: false }).limit(30);
  if (error) return $("nl").innerHTML = fail(error, "announcements (block C)");
  $("nl").innerHTML = data.length ? data.map(a => `<article class="glass card"><div>${esc(a.message)}</div><small>${fdate(a.created_at)}</small><span class="chip ${a.active ? "ok" : ""}">${a.active ? "Showing to users" : "Off"}</span>
    <div class="acts"><button data-a="${a.active ? "annoff" : "annon"}:${a.id}">${a.active ? "Turn off" : "Turn on"}</button><button class="danger" data-a="anndel:${a.id}">Delete</button></div></article>`).join("") : `<div class="glass empty">No announcements yet.</div>`;
}

/* ---------- activity log ---------- */
async function activity() {
  H(`<div id="al"><div class="ld"></div></div>`);
  const { data, error } = await db.from("admin_log").select("*").order("created_at", { ascending: false }).limit(100);
  if (error) return $("al").innerHTML = fail(error, "activity log (block D)");
  const ids = [...new Set(data.flatMap(r => [r.admin, r.target]).filter(Boolean))], P = {};
  if (ids.length) ((await db.from("profiles").select("id,display_name").in("id", ids)).data || []).forEach(p => P[p.id] = p.display_name);
  const nm = id => esc(id ? (P[id] || "deleted user") : "");
  const L = { ban: "banned", unban: "unbanned", del: "deleted", photo: "removed the photo of", mkadm: "made admin", rmadm: "removed admin from", rban: "banned (from a report)", rdis: "dismissed a report about", post: "posted an announcement", annoff: "turned off an announcement", annon: "turned on an announcement", anndel: "deleted an announcement", export_users: "exported the user list" };
  $("al").innerHTML = data.length ? data.map(r => `<div class="log"><b>${nm(r.admin)}</b> ${esc(L[r.action] || r.action)} <b>${nm(r.target)}</b>${r.note ? ` <small>(${esc(r.note)})</small>` : ""}<br><small>${ago(r.created_at)}</small></div>`).join("") : `<div class="glass empty">No admin actions yet.</div>`;
}
const logAct = (act, target, note) => db.rpc("admin_log_action", { act, target: target || null, note: note || null }).then(() => {}, () => {});

/* ---------- actions ---------- */
async function act(a, id) {
  const ask = { ban: "Ban this user? They will be signed out and hidden from everyone.", del: "Permanently DELETE this user and all their data? This cannot be undone.", photo: "Remove this profile photo?", rban: "Ban the reported user and close this report?",
    mkadm: "Give this user FULL admin access?", rmadm: "Remove this user's admin access?", anndel: "Delete this announcement?" };
  if (ask[a] && !confirm(ask[a])) return;
  const call = { ban: ["admin_set_ban", { target: id, banned: true }, "User banned"], unban: ["admin_set_ban", { target: id, banned: false }, "User unbanned"], del: ["admin_delete_user", { target: id }, "User deleted"],
    photo: ["admin_remove_photo", { target: id }, "Photo removed"], rban: ["admin_resolve_report", { rid: id, action: "ban" }, "User banned, report closed"], rdis: ["admin_resolve_report", { rid: id, action: "dismiss" }, "Report dismissed"],
    mkadm: ["admin_set_admin", { target: id, flag: true }, "Admin added"], rmadm: ["admin_set_admin", { target: id, flag: false }, "Admin removed"],
    post: ["admin_post_announcement", { msg: ($("nt") ? $("nt").value : "").trim() }, "Announcement posted"], annon: ["admin_toggle_announcement", { aid: id, state: true }, "Announcement on"],
    annoff: ["admin_toggle_announcement", { aid: id, state: false }, "Announcement off"], anndel: ["admin_delete_announcement", { aid: id }, "Announcement deleted"] }[a];
  if (a === "post" && call[1].msg.length < 3) return say("Write at least 3 characters");
  const { error } = await db.rpc(call[0], call[1]); if (error) return say(/function/i.test(error.message) ? "Run the matching SQL block first" : error.message);
  say(call[2]); logAct(a, ["post", "annon", "annoff", "anndel"].includes(a) ? null : id, a === "post" ? call[1].msg.slice(0, 60) : null); $("sheet").hidden = true; show();
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-a],[data-r],[data-f],[data-close]"); if (!b) return;
  if (b.dataset.close !== undefined) { $("sheet").hidden = true; return; }
  if (b.dataset.f) { ufilter = b.dataset.f; document.querySelectorAll(".fc[data-f]").forEach(x => x.classList.toggle("on", x === b)); renderUsers(); return; }
  if (b.dataset.r) { rtab = b.dataset.r; reports(); return; }
  const [a, id] = b.dataset.a.split(":"); if (a === "det") detail(id); else if (a === "export") exportCsv(); else act(a, id);
});
$("sheet").addEventListener("click", e => { if (e.target === $("sheet")) $("sheet").hidden = true; });
function show() { document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("on", b.dataset.t === tab)); ({ over, users, photos, reports, news, activity }[tab])(); }
$("tabs").addEventListener("click", e => { const b = e.target.closest("button"); if (b) { tab = b.dataset.t; show(); } });
$("out").addEventListener("click", async e => { e.preventDefault(); await db.auth.signOut(); location.href = "index.html"; });
(async () => {
  const { data: { session } } = await db.auth.getSession(); if (!session) { location.href = "index.html"; return; }
  const { data: p } = await db.from("profiles").select("is_admin").eq("id", session.user.id).maybeSingle();
  if (!p || !p.is_admin) { $("deny").hidden = false; return; }
  $("shell").hidden = false; show();
  const { count } = await db.from("reports").select("*", { count: "exact", head: true }).eq("status", "open"); badge(count || 0);
})();
</script></body></html>
