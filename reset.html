<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Crushly · Reset password</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="crushly.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head>
<body><canvas id="fx"></canvas>
<main class="wrap page">
<div id="top"></div>
<form id="form" class="glass" novalidate>
<p class="eyebrow">Reset password</p>
<h2>Choose a<br><span>new password</span></h2>
<div class="sep">&hearts;</div>
<div class="field"><label class="flex items-center gap-2 text-sm mb-2" for="pw"><svg width="18" height="18" viewBox="0 0 24 24" fill="#ff4fb3" aria-hidden="true"><path d="M17 9V7a5 5 0 0 0-10 0v2H5v12h14V9h-2Zm-8 0V7a3 3 0 0 1 6 0v2H9Z"/></svg> New password</label><div class="inp"><input id="pw" type="password" placeholder="8+ characters" autocomplete="new-password"><button type="button" class="eye" aria-label="Show password"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button></div></div>
<div class="field"><label class="flex items-center gap-2 text-sm mb-2" for="pw2"><svg width="18" height="18" viewBox="0 0 24 24" fill="#ff4fb3" aria-hidden="true"><path d="M17 9V7a5 5 0 0 0-10 0v2H5v12h14V9h-2Zm-8 0V7a3 3 0 0 1 6 0v2H9Z"/></svg> Confirm password</label><div class="inp"><input id="pw2" type="password" placeholder="Repeat your password" autocomplete="new-password"><button type="button" class="eye" aria-label="Show password"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button></div></div>
<button id="go" class="btn" type="submit">Save password &rarr;</button>
<div id="msg" class="msg" role="alert"></div>
<p class="switch"><a class="link nav" href="index.html">&larr; Back to login</a></p>
</form>
</main>
<script src="config.js"></script><script src="crushly.js"></script>
<script>
const $=id=>document.getElementById(id);
$('form').addEventListener('submit',async e=>{
  e.preventDefault();
  const password=$('pw').value;
  if(password.length<8){crushly.msg('Use a password of at least 8 characters.');return}
  if(password!==$('pw2').value){crushly.msg('The two passwords do not match.');return}
  const {data:{session}}=await db.auth.getSession();
  if(!session){crushly.msg('Open this page from the link in your reset email.');return}
  $('go').disabled=true;
  const {error}=await db.auth.updateUser({password});
  $('go').disabled=false;
  if(error){crushly.msg(error.message);return}
  await db.auth.signOut();crushly.msg('Password updated. Please log in with your new password.',true);
  setTimeout(()=>location.href='index.html',1200);
});
</script></body></html>
